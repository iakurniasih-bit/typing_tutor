function balloonRound(o,next){
 const T=o.text;let k=0,shown=o.kb!=='hidden',miss2=0,counted=0;
 A.innerHTML=`${hdr(o.title+' · '+o.lab+' ('+o.idx+'/'+o.total+')')}<h2>${o.h}</h2>${o.gloss?`<p class="fing">${bi('','Artinya: '+o.gloss)}</p>`:''}<div id="cap" class="warn" style="display:none">${bi('Caps Lock is ON. Press the Caps Lock key once to turn it off.','Caps Lock menyala. Tekan tombol Caps Lock sekali untuk mematikannya.')}</div><div class="bls" id="bls" style="${szVars(T.length)}">${[...T].map((c,i)=>c===' '?`<div class="spb${i===0?' act':''}"><span>space</span></div>`:`<div class="b2 c${i%6}${i===0?' act':''}"><span>${c}</span></div>`).join('')}</div><div id="hd"></div><p class="fing" id="fg"></p><div id="kbw"></div><p id="msg" class="msg"></p>`;
 const TH={right:['right','kanan'],left:['left','kiri'],either:['either','yang mana saja']}[o.thumb||'either'];
 const thumbMsg=bi('Press the space bar with your '+TH[0]+' thumb.','Tekan spasi dengan ibu jari '+TH[1]+'.');

  else{kbw.innerHTML=`<button class="back" id="sk">${bi('Show keys','Lihat tombol')}</button>`;fg.innerHTML='';kbw.querySelector('#sk').onclick=()=>{shown=true;if(!counted){tyH++;counted=1}draw()}}};

   msg(want===' '?'Press the space bar with your '+TH[0]+' thumb.':'Find the letter "'+want+'". Use your '+f[0]+'.',want===' '?'Tekan spasi dengan ibu jari '+TH[1]+'.':'Cari huruf "'+want+'". Pakai '+f[1]+'.');

function starRound(o,next){
 const rush=!!o.sec,gen=runId;
 let n=0,k=0,caught=0,shown=o.kb!=='hidden',miss2=0,counted=0,lock=0,over=0,cur=rush?o.gen():o.targets[0];
 clearTimeout(tmr);
 A.innerHTML=`${hdr(o.title)}<h2>${o.h}</h2>${rush?`<p class="intro">${bi('You have 45 seconds. There is no penalty. Do your best!','Kamu punya 45 detik. Tidak ada hukuman. Lakukan yang terbaik!')}</p>${timerHTML}`:`<p class="intro">${bi('Type the letters on the star to catch it. The star never goes away. Take your time.','Ketik huruf di bintang untuk menangkapnya. Bintang tidak akan pergi. Santai saja.')}</p>`}<div id="cap" class="warn" style="display:none">${capsMsg}</div><p class="fing" id="pg"></p><div class="sky"><div class="starw" id="fw"><div class="tag" id="tg"></div>${STAR}</div></div><p class="fing" id="fg"></p><div id="kbw"></div><p id="msg" class="msg"></p>`;
 const fw=A.querySelector('#fw'),tg=A.querySelector('#tg'),kbw=A.querySelector('#kbw'),fg=A.querySelector('#fg'),pg=A.querySelector('#pg');
 const draw=()=>{
  pg.innerHTML=rush?bi('Stars caught: '+caught,'Bintang tertangkap: '+caught):bi('Star '+(n+1)+' of '+o.targets.length,'Bintang ke-'+(n+1)+' dari '+o.targets.length);

function wordBalloons(o,next){
 const T=o.text;let k=0,shown=o.kb!=='hidden',miss2=0,counted=0;
 const isUp=c=>c!==c.toLowerCase(),low=c=>c.toLowerCase();

 A.innerHTML=`${hdr(o.title+' · '+o.lab+' ('+o.idx+'/'+o.total+')')}<h2>${o.h}</h2>${o.gloss?`<p class="fing">${bi('','Artinya: '+o.gloss)}</p>`:''}<div id="cap" class="warn" style="display:none">${capsMsg}</div><div class="bls" id="bls" style="${szVars(T.length)}">${[...T].map((c,i)=>c===' '?`<div class="spb${i===0?' act':''}"><span>space</span></div>`:`<div class="b2 c${i%6}${i===0?' act':''}"><span>${c}</span></div>`).join('')}</div><p class="fing" id="fg"></p><div id="kbw"></div><p id="msg" class="msg"></p>`;

  if(shown){kbw.innerHTML=`<div class="kb${o.kb==='faded'?' faded':''}">${kbHTML(low(T[k]||''))}</div>`;const c=T[k];fg.innerHTML=c?bi(hint(c)[0],hint(c)[1]):''}

function m1(i){

 const L=[
  ['please thanks','Level 1: polite words','Level 1: kata sopan','shown','tolong, terima kasih'],
  ['sorry excuse me','Level 2: more kind words','Level 2: kata baik lainnya','faded','maaf, permisi'],

  ['Please help me, friend.','Level 4: a polite sentence','Level 4: kalimat sopan','faded','Tolong bantu aku, teman.'],
  ['Thank you for being kind.','Level 5: no help from the keyboard','Level 5: tanpa bantuan keyboard','hidden','Terima kasih sudah baik.']];

  sr('Stage 2',bi('Practice 2: kind words','Latihan 2: kata-kata baik'),'hidden',['kind','help','share','listen']),
  sr('Stage 3',bi('Practice 3: longer polite words','Latihan 3: kata sopan yang lebih panjang'),'hidden',['welcome','excuse','respect','polite']),
  nx=>starRound({title:T+' · Part 1 · Star Rush',h:bi('Star Rush! Catch as many polite words as you can.','Star Rush! Tangkap kata sopan sebanyak yang kamu bisa.'),kb:'hidden',sec:45,gen:()=>POL[Math.random()*POL.length|0]},nx)];
